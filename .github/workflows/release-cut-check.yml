name: Release Cut Check

# Validates the pull request opened by `scripts/release-cut`: it must only bump
# the version and lock files from X.Y.0-dev to X.(Y+1).0-dev, where X.Y comes
# from the branch name release-cut/vX.Y. Lock files are verified by
# `scripts/workflows/version check`.
#
# It runs on any pull request whose branch starts with `release-cut/v` or whose
# title contains "cut release", so a PR that looks like a release cut but was
# not opened by the script fails here instead of going unchecked.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: "Check release cut"
    if: >-
      startsWith(github.head_ref, 'release-cut/v') ||
      contains(github.event.pull_request.title, 'cut release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"

      - name: Validate release cut
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          # 1. The branch name tells which release is cut: release-cut/v0.8
          #    means main goes from 0.8.0-dev to 0.9.0-dev.
          [[ "$(./scripts/workflows/version branch --kind "$HEAD_REF" 2> /dev/null)" == release-cut ]] \
            || fail "Branch '$HEAD_REF' is not release-cut/vX.Y."
          MAJOR=$(./scripts/workflows/version branch --major "$HEAD_REF")
          MINOR=$(./scripts/workflows/version branch --minor "$HEAD_REF")
          OLD="${MAJOR}.${MINOR}.0-dev"
          NEW="${MAJOR}.$((MINOR + 1)).0-dev"

          # 2. main must still be on the version being released.
          MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
          for component in --mosaicod --py; do
            [[ "$(./scripts/workflows/version get "$component" "$MERGE_BASE")" == "$OLD" ]] || fail "main is not on $OLD ($component)."
          done

          # 3. Only the version and lock files can change.
          CHANGED=$(git diff --name-only "$MERGE_BASE" HEAD | LC_ALL=C sort | tr '\n' ' ')
          [[ "$CHANGED" == "mosaico-sdk-py/pyproject.toml mosaico-sdk-py/uv.lock mosaicod/Cargo.lock mosaicod/Cargo.toml " ]] \
            || fail "The PR must only change the version and lock files, found: $CHANGED"

          # 4. The files must be on the new version, with lock files in sync.
          ./scripts/workflows/version check "$NEW" || fail "Version or lock files are not on $NEW."
