name: Release

# Releases mosaicod or the Python SDK from a release/vX.Y branch: moves the
# component from X.Y.Z-rc to X.Y.Z, tags that commit, then opens the next
# release candidate X.Y.(Z+1)-rc. It also creates the GitHub release of the
# tag, with the changelog generated by scripts/workflows/changelog.sh as its text. Run it
# from the Actions tab on release/vX.Y.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
# workflows that run on the new tag and on release/v* are dispatched explicitly.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to release"
        type: choice
        options: [mosaicod, python]
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: "Release ${{ inputs.component }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Release
        id: release
        env:
          COMPONENT: ${{ inputs.component }}
          # Used by scripts/workflows/changelog.sh to read the authors and by gh to create the release.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          # Example: mosaicod is on 0.8.1-rc on release/v0.8.

          # 1. The workflow must run on a release/vX.Y branch: release/v0.8
          #    means the component must be on a 0.8.Z-rc version.
          [[ "$GITHUB_REF_TYPE" == branch && "$(./scripts/workflows/version branch --kind "$GITHUB_REF_NAME" 2> /dev/null)" == release ]] \
            || fail "Run this workflow on a release/vX.Y branch, not '$GITHUB_REF_NAME'."
          MAJOR=$(./scripts/workflows/version branch --major "$GITHUB_REF_NAME")
          MINOR=$(./scripts/workflows/version branch --minor "$GITHUB_REF_NAME")

          # 2. Pick the component to release and its tag prefix:
          #    mosaicod is tagged v0.8.1, the Python SDK py/v0.8.1.
          case "$COMPONENT" in
            mosaicod) FLAG=--mosaicod; TAG_PREFIX=v; NAME=mosaicod ;;
            python) FLAG=--py; TAG_PREFIX=py/v; NAME="Python SDK" ;;
            *) fail "Unknown component '$COMPONENT'." ;;
          esac

          # 3. Read the current version of the component (0.8.1-rc) and derive
          #    the stable version (0.8.1), the next release candidate (0.8.2-rc)
          #    and the tag (v0.8.1).
          CURRENT=$(./scripts/workflows/version get "$FLAG")
          [[ "$CURRENT" =~ ^${MAJOR}\.${MINOR}\.([0-9]+)-rc$ ]] \
            || fail "$NAME version '$CURRENT' is not a ${MAJOR}.${MINOR}.Z-rc version."
          PATCH="${BASH_REMATCH[1]}"
          STABLE="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_RC="${MAJOR}.${MINOR}.$((PATCH + 1))-rc"
          TAG="${TAG_PREFIX}${STABLE}"

          # 4. Never overwrite a release: the tag must not exist yet.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            fail "Tag $TAG already exists."
          fi

          # 5. Generate the release notes: the changelog of the component since
          #    its previous release, without the "## [0.8.1] - <date>" title
          #    (the GitHub release has its own). It runs before any commit, so
          #    HEAD is already on GitHub and the authors can be fetched.
          NOTES="$RUNNER_TEMP/release-notes.md"
          ./scripts/workflows/changelog.sh "$FLAG" | sed '1d' | sed '/./,$!d' > "$NOTES"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 6. Release commit: set the component to 0.8.1, refresh its lock
          #    file and tag the commit. Only this component is touched.
          ./scripts/workflows/version set "$FLAG" "$STABLE"
          git commit --quiet -am "chore: release $NAME v$STABLE"
          git tag -a "$TAG" -m "$NAME v$STABLE"

          # 7. Open the next release candidate on the branch: 0.8.2-rc.
          ./scripts/workflows/version set "$FLAG" "$NEXT_RC"
          git commit --quiet -am "chore: bump $NAME to $NEXT_RC"

          # 8. Push the branch and the tag together. Atomic: either both land or
          #    neither does. If someone pushed to the branch in the meantime,
          #    the push is rejected and nothing is released.
          git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 9. Create the GitHub release of the tag with the notes as its text.
          #    Only mosaicod can be marked as the latest release, and only if
          #    it is the highest mosaicod version: a patch of an older branch
          #    or an SDK release never replaces it.
          LATEST=false
          if [[ "$COMPONENT" == mosaicod && "$(git tag -l 'v[0-9]*' | sort -V | tail -n 1)" == "$TAG" ]]; then
            LATEST=true
          fi
          gh release create "$TAG" --verify-tag --title "$NAME v$STABLE" --notes-file "$NOTES" --latest="$LATEST"

          {
            echo "### $NAME v$STABLE released"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Next version on \`$GITHUB_REF_NAME\` | \`$NEXT_RC\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch mosaicod workflows
        if: inputs.component == 'mosaicod'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # 10. The push above used GITHUB_TOKEN, so it triggered nothing: start
          #     the builds explicitly. The binaries and the container image are
          #     built from the tag, the release candidate image from the branch.
          #     The binaries are attached to the release created above, whose
          #     text is kept.
          gh workflow run mosaicod-release-docker.yml --ref "$TAG"
          gh workflow run mosaicod-release-precompiled.yml --ref "$TAG"
          gh workflow run mosaicod-rc-docker.yml --ref "$GITHUB_REF_NAME"
          {
            echo "| Dispatched on \`$TAG\` | \`mosaicod-release-docker.yml\`, \`mosaicod-release-precompiled.yml\` |"
            echo "| Dispatched on \`$GITHUB_REF_NAME\` | \`mosaicod-rc-docker.yml\` |"
          } >> "$GITHUB_STEP_SUMMARY"
